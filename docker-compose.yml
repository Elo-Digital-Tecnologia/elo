version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: elo-digital-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-elo_digital}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elo_digital}
      POSTGRES_DB: ${DB_NAME:-elo_digital}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elo_digital} -d ${DB_NAME:-elo_digital}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - elo-network

  redis:
    image: redis:7-alpine
    container_name: elo-digital-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - elo-network

volumes:
  postgres_data:
  redis_data:

networks:
  elo-network:
    driver: bridge