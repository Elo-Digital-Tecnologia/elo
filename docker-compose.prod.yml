version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: elo-digital-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: elo-digital-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - elo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: elo-digital-api-prod
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE}
      SUPERADMIN_KEY: ${SUPERADMIN_KEY}
      FRONTEND_URLS: ${FRONTEND_URLS}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      WEB_MENU_URL: ${WEB_MENU_URL}
      WEB_ADMIN_URL: ${WEB_ADMIN_URL}
      WEB_RESTAURANT_URL: ${WEB_RESTAURANT_URL}
      WEB_KITCHEN_URL: ${WEB_KITCHEN_URL}
      THROTTLE_TTL: ${THROTTLE_TTL}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-admin:
    build:
      context: ./apps/web-admin
      dockerfile: Dockerfile
    container_name: elo-digital-web-admin-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    networks:
      - elo-network
    restart: unless-stopped

  web-restaurant:
    build:
      context: ./apps/web-restaurant
      dockerfile: Dockerfile
    container_name: elo-digital-web-restaurant-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    networks:
      - elo-network
    restart: unless-stopped

  web-menu:
    build:
      context: ./apps/web-menu
      dockerfile: Dockerfile
    container_name: elo-digital-web-menu-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    networks:
      - elo-network
    restart: unless-stopped

  web-kitchen:
    build:
      context: ./apps/web-kitchen
      dockerfile: Dockerfile
    container_name: elo-digital-web-kitchen-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    networks:
      - elo-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: elo-digital-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web-admin
      - web-restaurant
      - web-menu
      - web-kitchen
    networks:
      - elo-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  elo-network:
    driver: bridge