packages:
    - apps/*
    - packages/*

# Install scripts are opt-in. @nestjs/core only prints a funding notice.
allowBuilds:
    '@nestjs/core': false
    # The platform binary comes from an optional dependency; its install script is not needed.
    '@swc/core': false
    # Testcontainers' Docker client: native speedups only, it works without them.
    cpu-features: false
    protobufjs: false
    ssh2: false
