name: CI

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

# Read-only token: the workflow only checks the code, it never writes to the repository.
permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # Throwaway values for this run only; no repository secret is used. The rest
            # comes from the .env.example files copied below. The e2e database is a
            # Testcontainers Postgres started by the suite itself.
            NODE_ENV: test
            JWT_ACCESS_TOKEN_SECRET: ci-only-jwt-secret-used-nowhere-else
            SUPERADMIN_KEY: ci-only-superadmin-key-used-nowhere-else
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: cp .env.example .env && cp apps/api/.env.example apps/api/.env
            - run: pnpm exec turbo run lint build
            - run: pnpm --filter @elo/core test
            - run: pnpm --filter @elo/api test
            - run: pnpm --filter @elo/api test:e2e
