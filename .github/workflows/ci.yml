name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # Lint and Type Check
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run format check
        run: pnpm format --check

  # Test
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elo_digital
          POSTGRES_PASSWORD: elo_digital
          POSTGRES_DB: elo_digital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://elo_digital:elo_digital@localhost:5432/elo_digital_test
          NODE_ENV: test

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://elo_digital:elo_digital@localhost:5432/elo_digital_test
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-testing-only
          REDIS_URL: redis://localhost:6379

  # Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build Docker images
        run: |
          docker build -t elo-digital/api:latest ./apps/api
          docker build -t elo-digital/web-admin:latest ./apps/web-admin
          docker build -t elo-digital/web-restaurant:latest ./apps/web-restaurant
          docker build -t elo-digital/web-menu:latest ./apps/web-menu
          docker build -t elo-digital/web-kitchen:latest ./apps/web-kitchen

      - name: Save Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save elo-digital/api:latest | gzip > api.tar.gz
          docker save elo-digital/web-admin:latest | gzip > web-admin.tar.gz
          docker save elo-digital/web-restaurant:latest | gzip > web-restaurant.tar.gz
          docker save elo-digital/web-menu:latest | gzip > web-menu.tar.gz
          docker save elo-digital/web-kitchen:latest | gzip > web-kitchen.tar.gz

      - name: Upload Docker images as artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            api.tar.gz
            web-admin.tar.gz
            web-restaurant.tar.gz
            web-menu.tar.gz
            web-kitchen.tar.gz
          retention-days: 7

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: ./docker-images

      - name: Load Docker images
        run: |
          docker load < ./docker-images/api.tar.gz
          docker load < ./docker-images/web-admin.tar.gz
          docker load < ./docker-images/web-restaurant.tar.gz
          docker load < ./docker-images/web-menu.tar.gz
          docker load < ./docker-images/web-kitchen.tar.gz

      - name: Deploy to Staging
        run: |
          # This would typically use SSH to deploy to a staging server
          # Example: docker-compose -f docker-compose.staging.yml up -d
          echo "Deploying to staging..."

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: ./docker-images

      - name: Load Docker images
        run: |
          docker load < ./docker-images/api.tar.gz
          docker load < ./docker-images/web-admin.tar.gz
          docker load < ./docker-images/web-restaurant.tar.gz
          docker load < ./docker-images/web-menu.tar.gz
          docker load < ./docker-images/web-kitchen.tar.gz

      - name: Deploy to Production
        run: |
          # This would typically use SSH to deploy to production servers
          # Example: docker-compose -f docker-compose.prod.yml up -d
          echo "Deploying to production..."

      - name: Run database migrations
        run: |
          # Run production migrations
          echo "Running production migrations..."

      - name: Verify deployment
        run: |
          # Health checks
          echo "Verifying deployment..."